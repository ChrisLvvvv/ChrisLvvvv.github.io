<header class="masthead" data-site-header>
  <a class="site-mark" href="{{ '/' | relative_url }}" aria-label="Taoyu Lyu, home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 4h26M16 4v24M3 28h26M7 9v14m18-14v14"/></svg>
    <span>Taoyu Lyu</span>
  </a>
  <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
    <span>Menu</span><i aria-hidden="true"></i>
  </button>
  <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
    <ol>
      {% for link in site.data.navigation.main %}
        <li{% if page.url == link.url or page.url contains link.url and link.url != '/' %} class="is-current"{% endif %}>
          <span>0{{ forloop.index }}</span><a href="{{ link.url | relative_url }}">{{ link.title }}</a>
        </li>
      {% endfor %}
    </ol>
  </nav>
</header>
