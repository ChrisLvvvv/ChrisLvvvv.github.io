---
layout: default
author_profile: false
---

<div id="main" role="main" class="site-shell site-shell--archive">
  <div class="archive archive--shell">
    <header class="page-header page-header--archive">
      <h1 class="page__title">{{ page.title }}</h1>
      {% if page.intro %}<p class="page-header__intro">{{ page.intro }}</p>{% endif %}
    </header>
    {% include base_path %}
    {% for post in page.posts %}
      {% include archive-single.html %}
    {% endfor %}
  </div>
</div>
