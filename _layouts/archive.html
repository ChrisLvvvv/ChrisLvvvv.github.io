---
layout: default
---
<main id="main" class="site-main interior-page" data-page="archive">
  <div class="editorial-page{% if page.work_index %} work-page{% endif %}">
    {% if page.work_index %}
    <header class="work-header">
      <h1>{{ page.title }}</h1>
    </header>
    {% else %}
    <header class="editorial-header" data-hero-reveal>
      <p class="section-code">INDEX / {{ page.title | upcase }}</p>
      <h1>{{ page.title }}</h1>
      {% if page.intro %}<p class="editorial-header__intro">{{ page.intro }}</p>{% endif %}
      <span class="editorial-header__rule" aria-hidden="true"></span>
    </header>
    {% endif %}
    <div class="archive-content">{{ content }}</div>
  </div>
</main>
