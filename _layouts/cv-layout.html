---
layout: default
---
{% assign resume_files = site.static_files | where: 'path', page.resume_pdf %}
<main id="main" class="site-main cv-shell" data-page="resume" data-resume-state="{% if resume_files.size > 0 %}pdf{% else %}fallback{% endif %}">
  <header class="resume-header">
    <h1>{{ page.title }}</h1>
    {% if resume_files.size > 0 %}
    <div class="resume-actions">
      <a class="resume-download" href="{{ page.resume_pdf | relative_url }}" download="Taoyu_Lyu_Resume.pdf">Download PDF <span aria-hidden="true">↓</span></a>
      <a class="resume-open" href="{{ page.resume_pdf | relative_url }}" target="_blank" rel="noopener">Open Resume <span aria-hidden="true">↗</span></a>
    </div>
    {% endif %}
  </header>
  {% if resume_files.size > 0 %}
  <div class="resume-preview" aria-label="Resume PDF preview">
    <object class="resume-pdf" data="{{ page.resume_pdf | relative_url }}" type="application/pdf" title="Taoyu Lyu Resume">
      <p><a href="{{ page.resume_pdf | relative_url }}">Open Resume</a></p>
    </object>
  </div>
  {% else %}
  <div class="resume-document" itemprop="text">{{ content }}</div>
  {% endif %}
</main>
