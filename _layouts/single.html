---
layout: default
---
<main id="main" class="site-main interior-page">
  <article class="editorial-page" itemscope itemtype="https://schema.org/CreativeWork">
    <header class="editorial-header" data-hero-reveal>
      <p class="section-code">{% if page.permalink == '/cv/' %}Curriculum Vitae{% elsif page.permalink == '/about/' %}Profile{% else %}Note / {{ page.title | truncate: 24 }}{% endif %}</p>
      <h1 itemprop="headline">{{ page.title }}</h1>
      {% if page.intro %}<p class="editorial-header__intro">{{ page.intro }}</p>{% endif %}
      <span class="editorial-header__rule" aria-hidden="true"></span>
    </header>
    <div class="prose{% if page.permalink == '/cv/' %} prose--cv{% endif %}" itemprop="text">
      {{ content }}
    </div>
  </article>
</main>
